[workspace]
members = [
    "src-tauri"
]
resolver = "2"

[package]
name = "brute-ui"
version = "0.0.20"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "KeyboardEvent",
    "Event",
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url"
] }
