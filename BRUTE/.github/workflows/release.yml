name: Build BRUTE Multi-Platform

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v0.0.8

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WINDOWS ---
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-AMD64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: Windows-ARM64

          # --- macOS ---
          - platform: macos-13 # Intel macOS
            target: x86_64-apple-darwin
            name: macOS-Intel
          - platform: macos-15 # Apple Silicon (M-Series / upgraded from macos-14)
            target: aarch64-apple-darwin
            name: macOS-ARM64

          # --- LINUX ---
          - platform: ubuntu-22_04
            target: x86_64-unknown-linux-gnu
            name: Linux-AMD64
          - platform: ubuntu-22_04
            target: aarch64-unknown-linux-gnu
            name: Linux-ARM64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Trunk CLI
        run: cargo install trunk

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BRUTE __VERSION__'
          releaseBody: 'Automated cross-platform release for BRUTE.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}