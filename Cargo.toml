[workspace]
members = [
    "src-tauri"
]
resolver = "2"

[package]
name = "brute-ui"
version = "0.0.5"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["nightly"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
