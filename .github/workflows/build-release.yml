name: Build BRUTE Multi-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-AMD64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: Windows-ARM64
          - platform: macos-15
            target: x86_64-apple-darwin
            name: macOS-Intel
          - platform: macos-15
            target: aarch64-apple-darwin
            name: macOS-ARM64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-AMD64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux-ARM64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shorten Cargo Target Path on Windows (Avoid MAX_PATH 260-char limit)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=D:\t" >> $env:GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (Native + WASM target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install Trunk CLI
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build native wasm-bindgen for Ubuntu 22.04 ARM64 (GLIBC 2.35)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130
          mkdir -p ~/.cache/trunk/wasm-bindgen-0.2.130
          cp ~/.cargo/bin/wasm-bindgen ~/.cache/trunk/wasm-bindgen-0.2.130/wasm-bindgen

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: BRUTE
          tagName: ${{ github.ref_name }}
          releaseName: 'BRUTE __VERSION__'
          releaseBody: 'Automated cross-platform release for BRUTE.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
